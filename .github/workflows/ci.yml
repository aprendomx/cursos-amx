name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:cov

  test-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run edge function tests
        # --node-modules-dir=none: sin él, Deno detecta el package.json del
        # root (modo BYONM) y exige un node_modules que este job no tiene.
        run: >-
          deno test --allow-all --node-modules-dir=none
          supabase/functions/_shared/auth.test.ts
          supabase/functions/_shared/serviceAuth.test.ts
          supabase/functions/_shared/playToken.test.ts
          supabase/functions/_shared/rateLimit.test.ts
          supabase/functions/bulk-invite/index.test.ts
          supabase/functions/analytics/index.test.ts
          supabase/functions/push-notify/index.test.ts
          supabase/functions/video-analytics/index.test.ts

  test-e2e:
    runs-on: ubuntu-latest
    # Los specs de flujo crítico requieren un backend Supabase vivo y
    # credenciales (E2E_ADMIN_EMAIL/PASSWORD); no bloquea el CI por ahora.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # vite preview (webServer de Playwright) sirve dist/; sin build previo
      # el server nunca responde y el webServer muere por timeout a los 60s.
      - name: Build application
        run: npm run build
        env:
          # Sin URL/key el bundle llama createClient(undefined) y lanza al
          # cargar, dejando la app sin montar. El fallback dummy permite que
          # la UI renderice y pasen los specs de navegación; los flujos
          # contra backend real requieren configurar los secrets.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'dummy-anon-key-ci' }}

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

  # Aplica TODO el set de migraciones a un Postgres limpio y verifica el
  # esquema resultante. Es el job que faltaba: sin él, un error de SQL solo
  # se descubre cuando alguien intenta instalar desde cero.
  test-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Misma imagen que docker/docker-compose.yml, para que pg_cron y
        # pg_net existan de verdad y no haya que simularlos.
        image: supabase/postgres:15.8.1.085
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 55432 -U postgres -c "create database amx_test;"

      - name: Apply migrations and verify schema
        env:
          DB_URL: postgres://postgres:postgres@localhost:55432/amx_test
        run: scripts/test-migrations.sh

  # Check agregado: la protección de la rama main exige un status llamado
  # "ci". Reúne los jobs bloqueantes (los informativos test-e2e y audit
  # quedan fuera a propósito).
  ci:
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - test-unit
      - test-edge-functions
      - test-migrations
      - build
    steps:
      - name: All required checks passed
        run: echo "ok"

  audit:
    runs-on: ubuntu-latest
    # Informativo por ahora: no bloquea el CI ante vulnerabilidades.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit dependencies
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check bundle budget
        run: node scripts/check-bundle.js
