name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:cov

  test-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Comprobación de tipos de las Edge Functions. No estaba: el job solo
      # corría `deno test`, así que cuatro errores de tipos —dos en ai-proxy,
      # uno en hls-playlist y uno en notifications-worker— llevaban tiempo ahí
      # sin que nada los señalara.
      - name: Type-check edge functions
        run: >-
          deno check --node-modules-dir=none
          supabase/functions/_shared/*.ts
          supabase/functions/*/index.ts

      - name: Run edge function tests
        # --node-modules-dir=none: sin él, Deno detecta el package.json del
        # root (modo BYONM) y exige un node_modules que este job no tiene.
        run: >-
          deno test --allow-all --node-modules-dir=none
          supabase/functions/_shared/auth.test.ts
          supabase/functions/_shared/serviceAuth.test.ts
          supabase/functions/_shared/playToken.test.ts
          supabase/functions/_shared/rateLimit.test.ts
          supabase/functions/bulk-invite/index.test.ts
          supabase/functions/analytics/index.test.ts
          supabase/functions/push-notify/index.test.ts
          supabase/functions/video-analytics/index.test.ts

  test-e2e:
    runs-on: ubuntu-latest
    # Los specs que necesitan un backend Supabase vivo se saltan solos cuando
    # no hay credenciales, así que lo que queda aquí debe pasar siempre. Se
    # mantiene continue-on-error mientras se confirma que el job es estable;
    # quitarlo es lo que le devuelve el poder de delatar una regresión.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # vite preview (webServer de Playwright) sirve dist/; sin build previo
      # el server nunca responde y el webServer muere por timeout a los 60s.
      - name: Build application
        run: npm run build
        env:
          # Sin URL/key el bundle llama createClient(undefined) y lanza al
          # cargar, dejando la app sin montar. El fallback dummy deja que la UI
          # renderice; los flujos contra backend real requieren los secrets, y
          # sin ellos esos specs se SALTAN (ver e2e/critical-flow.spec.js).
          #
          # Antes este comentario decía que con el dummy «la UI renderiza».
          # Renderizaba, sí: 7.3 s tarde, porque el arranque esperaba a los
          # feature flags contra una API inalcanzable. El expect de Playwright
          # se rendía a los 5 s. No era un problema de credenciales.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'dummy-anon-key-ci' }}

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

  # Aplica TODO el set de migraciones a un Postgres limpio y verifica el
  # esquema resultante. Es el job que faltaba: sin él, un error de SQL solo
  # se descubre cuando alguien intenta instalar desde cero.
  test-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Misma imagen que docker/docker-compose.yml, para que pg_cron y
        # pg_net existan de verdad y no haya que simularlos.
        image: supabase/postgres:15.8.1.085
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 55432 -U postgres -c "create database amx_test;"

      # Base nueva, no la `postgres` de la imagen: ahí `auth` y `storage` ya
      # existen, pertenecen a supabase_auth_admin / supabase_storage_admin y el
      # usuario `postgres` de esta imagen no puede alterarlas —storage.buckets
      # llega además sin las columnas que usan las migraciones 016/019/020/025—.
      #
      # STUB_EXTENSIONS=1 neutraliza `create extension pg_cron/pg_net`, que solo
      # se pueden instalar en la base que indica cron.database_name. Los stubs
      # aportan firmas compatibles de cron.schedule/unschedule.
      #
      # LO QUE ESTO NO CUBRE: que pg_cron y pg_net existan de verdad y que los
      # jobs queden agendados. Se comprueba en el despliegue, donde
      # scripts/deploy.sh verifica el esquema resultante.
      - name: Apply migrations and verify schema
        env:
          DB_URL: postgres://postgres:postgres@localhost:55432/amx_test
          STUB_EXTENSIONS: '1'
        run: scripts/test-migrations.sh

  # La configuración de Kong se renderiza en el arranque y sus expresiones Lua
  # llevan comillas simples. Un reformateo automático del YAML basta para dejar
  # la instalación sin gateway —y por tanto sin API— sin que el archivo crudo
  # se vea mal. Se verifica renderizando.
  test-kong-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render kong.yml and parse it
        run: scripts/test-kong-config.sh

  # El script que crea al primer administrador es el único camino soportado
  # para que una instalación nueva tenga a alguien que pueda entrar al panel.
  # Sus caminos de error —correo inválido, contraseña corta, falta de terminal—
  # son los que nadie prueba a mano, y que se cuelgue esperando entrada en un
  # despliegue automatizado no se descubriría hasta que pasara en producción.
  test-crear-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run crear-admin.sh checks
        run: scripts/test-crear-admin.sh

  # La verificación del despliegue fallaba en abierto: una comprobación que no
  # se podía ejecutar se reportaba como superada, y así pasaron inadvertidos
  # funciones caídas, RLS sin comprobar y una comprobación de escalada de
  # privilegios que nunca corrió. Aquí se fija su tabla de clasificación.
  test-deploy-verificacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy verification logic
        run: scripts/test-deploy-verificacion.sh

  # Check agregado: la protección de la rama main exige un status llamado
  # "ci". Reúne los jobs bloqueantes (los informativos test-e2e y audit
  # quedan fuera a propósito).
  ci:
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - test-unit
      - test-edge-functions
      - test-migrations
      - test-kong-config
      - test-crear-admin
      - test-deploy-verificacion
      - build
    steps:
      - name: All required checks passed
        run: echo "ok"

  audit:
    runs-on: ubuntu-latest
    # Informativo por ahora: no bloquea el CI ante vulnerabilidades.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit dependencies
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check bundle budget
        run: node scripts/check-bundle.js
